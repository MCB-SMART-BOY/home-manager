# Kitty 终端配置 — Catppuccin Mocha 主题（标准调色板，偏紫暖调）
# ~/.config/kitty/kitty.conf
#
# 配色：标准 Catppuccin Mocha（Surface1 黑底 + Teal 青 + Subtext1 白字）
# 字体：JetBrainsMono Nerd Font 12pt（Garuda Konsole 同款）
# 行为：Garuda Konsole 移植（自动复制 + 去尾部空格 + fish shell）

# ══════════════════════════════════════════════════════════════════
# 🪟 窗口
# ══════════════════════════════════════════════════════════════════
hide_window_decorations yes
window_padding_width 18
background_opacity 1.0
dynamic_background_opacity yes
window_alert_on_bell no
confirm_os_window_close 0
initial_window_width  110c
initial_window_height 32c

# ══════════════════════════════════════════════════════════════════
# 📜 滚动
# ══════════════════════════════════════════════════════════════════
scrollback_lines 20000
scrollback_pager_history_size 128
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 3.0

# ══════════════════════════════════════════════════════════════════
# 🔤 字体（JetBrainsMono Nerd Font, 16pt）
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0
adjust_line_height 0
adjust_column_width  0
disable_ligatures never

# ══════════════════════════════════════════════════════════════════
# 📏 光标（Garuda Mokka: 红色方块闪烁光标）
# ══════════════════════════════════════════════════════════════════
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 0.0
cursor #ff0000
cursor_text_color #1e1e2e

# ══════════════════════════════════════════════════════════════════
# 🖱️ 鼠标 + 选择（Garuda Konsole: 自动复制 + 去尾部空格）
# ══════════════════════════════════════════════════════════════════
copy_on_select        yes
strip_trailing_spaces smart
mouse_hide_wait       -1.0
click_interval        0.5
focus_follows_mouse   no

# ══════════════════════════════════════════════════════════════════
# 🔔 提示音
# ══════════════════════════════════════════════════════════════════
enable_audio_bell no
visual_bell_duration 0.0

# ══════════════════════════════════════════════════════════════════
# ⌨️ 键盘绑定
# ══════════════════════════════════════════════════════════════════
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+n new_window
map ctrl+equal  change_font_size all +1.0
map ctrl+plus   change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all restore

# ══════════════════════════════════════════════════════════════════
# 🎨 Catppuccin Mocha 配色（Garuda Mokka Konsole 精确移植）
# ══════════════════════════════════════════════════════════════════

# 背景 / 前景
foreground #cdd6f4
background #1e1e2e

# 选择
selection_foreground #cdd6f4
selection_background #585b70

# 链接
url_color #89b4fa

# 常规色 (0-7) — Catppuccin Mocha 标准
color0 #45475a  # Surface1
color1 #f38ba8  # Red
color2 #a6e3a1  # Green
color3 #f9e2af  # Yellow
color4 #89b4fa  # Blue
color5 #cba6f7  # Mauve
color6 #94e2d5  # Teal
color7 #bac2de  # Subtext1

# 亮色 (8-15)
color8  #585b70  # Surface2
color9  #eba0ac  # Maroon
color10 #a6e3a1  # Green
color11 #f9e2af  # Yellow
color12 #89b4fa  # Blue
color13 #cba6f7  # Mauve
color14 #94e2d5  # Teal
color15 #a6adc8  # Subtext0

# ══════════════════════════════════════════════════════════════════
# 🖼️ Kitty 图形协议
# ══════════════════════════════════════════════════════════════════
allow_remote_control yes
placement_strategy center

# ══════════════════════════════════════════════════════════════════
# 🐟 Shell（Garuda Konsole 使用 fish）
# ══════════════════════════════════════════════════════════════════
shell fish

# 窗口标题
window_title_format {title} — kitty
