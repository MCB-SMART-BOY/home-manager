# Helix 编辑器配置
# ~/.config/helix/config.toml

# 主题配色
theme = "nord-night"

[editor]
# 基础体验
line-number = "relative"
cursorline = true
cursorcolumn = true
popup-border = "all"
# 自动保存/格式化（保存时触发）
auto-save = true
auto-format = true
scrolloff = 8
scroll-lines = 3
mouse = true
true-color = true
# 空闲刷新间隔（影响插件/LSP 提示）
idle-timeout = 100
# 标尺（默认 100 列提示）
rulers = [100]

# 缓冲区管理
bufferline = "multiple" # 多文件时显示标签栏
color-modes = true      # 状态栏模式变色

# Shell 环境
shell = ["zsh", "-c"]

# 格式化与换行
text-width = 100
default-line-ending = "lf"

# ✅ 新特性: 粘性上下文 (Sticky Context)
# 在函数/类过长时，将定义行吸附在顶部
#[editor.sticky-context]
#enable = true
#indicator = true

# 状态栏（Statusline）
[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name", "read-only-indicator", "file-modification-indicator"]
center = ["diagnostics", "workspace-diagnostics"]
right = ["selections", "register", "position", "position-percentage", "file-encoding", "file-line-ending", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

# LSP 行为
[editor.lsp]
enable = true
display-messages = true
display-inlay-hints = true  # 内嵌提示 (Inlay Hints)
auto-signature-help = true
snippets = true

# 光标形状
[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

# 文件选择器
[editor.file-picker]
# LazyVim 风格：能找隐藏文件，但继续尊重 gitignore，避免把 build 产物扫进来。
hidden = true
git-ignore = true
git-global = true
git-exclude = true

# 自动配对
[editor.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'
'`' = '`'
'<' = '>'

# 搜索
[editor.search]
# 智能大小写：有大写才区分大小写
smart-case = true
wrap-around = true

# 空白字符 (默认隐藏，按需开启)
[editor.whitespace]
# 空白符显示策略
render = "none"

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
tab = "→"
newline = "↵"

# 缩进参考线
[editor.indent-guides]
render = true
character = "│"
skip-levels = 0

# 侧边栏 (Gutters)
[editor.gutters]
# 侧边栏：诊断、行号、diff 等
layout = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]

[editor.gutters.line-numbers]
min-width = 3

# 软换行 (Soft Wrap)
[editor.soft-wrap]
enable = false
max-wrap = 20
max-indent-retain = 40
wrap-indicator = "↪ "

# 智能 Tab (Smart Tab)
[editor.smart-tab]
enable = true
supersede-menu = false

# ══════════════════════════════════════════════════════════════════
# ⌨️ 快捷键
# ══════════════════════════════════════════════════════════════════
#
# 设计约定：
#   f 找文件 / s 搜内容与符号 / c 代码操作 / x 诊断 / g Git / u 编辑器开关 / q 退出
#   一个功能一个分组入口（Space xx），高频功能最多再加一个更短的直达入口
#   Normal 与 Select 共享工作流键；编辑键按模式区分（Normal move_*，Select extend_*）
#   Space 分组是"节点对节点"递归合并，默认项自动保留；
#   但默认键是"叶子"时（Space f / b / g / s），改写成表会整体替换该叶子，
#   并丢掉它的原生兄弟键 —— 改写时必须把要保留的默认项显式补回。

[keys.normal]
# 系统操作
"C-s" = ":w"
"C-q" = ":q"
"C-o" = "jump_backward"
"C-i" = "jump_forward"

# 窗口导航（类 Tmux/Vim）
"C-h" = "jump_view_left"
"C-j" = "jump_view_down"
"C-k" = "jump_view_up"
"C-l" = "jump_view_right"

# 缓冲区切换
"H" = "goto_previous_buffer"
"L" = "goto_next_buffer"
"[" = { b = "goto_previous_buffer", d = "goto_prev_diag", g = "goto_prev_change" }
"]" = { b = "goto_next_buffer", d = "goto_next_diag", g = "goto_next_change" }

# 编辑
"C-/" = "toggle_comments"
"A-j" = "move_line_down"
"A-k" = "move_line_up"
# 剪贴板策略 A：编辑器内部搬运走默认寄存器（原生 y/p/P/R 与 d/c 同一通道），
# 与外部程序交换统一走 Space y / Space p / Space P / Space R

# 搜索
"n" = "search_next"
"N" = "search_prev"
"*" = "search_selection_detect_word_boundaries"

# g 子图：子节点递归合并，默认项（gg/ge/gf/gs/gc/gb/gj/gk…）继续生效
# gt = goto_window_top 保持原生；类型定义统一用 gy
"g" = { l = "goto_line_end", h = "goto_line_start", d = "goto_definition", D = "goto_declaration", r = "goto_reference", i = "goto_implementation", y = "goto_type_definition", K = "signature_help" }
# K 保持原生 keep_selections（按正则保留选区）；文档用默认 Space k 或 Space c h

# Leader 键（Space），按 LazyVim 的 file/buffer/search/window/code 习惯分组。
[keys.normal.space]
space = "file_picker"
"/" = "global_search"
"?" = "command_palette"
"-" = "hsplit"
"|" = "vsplit"
a = "code_action"
r = "rename_symbol"
# 与外部程序交换走 Space y/p/P/R；编辑器内部搬运仍是默认寄存器（原生 y/p/P/R）
y = "yank_to_clipboard"
p = "paste_clipboard_after"
P = "paste_clipboard_before"
R = "replace_selections_with_clipboard"
# Space h 归还原生 select_references_to_symbol_under_cursor；
# 强制退出（Space Q / Space q Q）已撤下，需要时显式输入 :qa!

[keys.normal.space.b]
b = "buffer_picker"
d = ":buffer-close"
n = "goto_next_buffer"
p = "goto_previous_buffer"
o = ":buffer-close-others"

[keys.normal.space.c]
a = "code_action"
f = ":format"
h = "hover"
r = "rename_symbol"
"=" = "format_selections"

[keys.normal.space.f]
f = "file_picker"
F = "file_picker_in_current_directory"
# e/E 是默认 file_explorer 系列：默认 Space f 是叶子，改写成表时会整体替换，
# 不显式补回就等于把它们删掉
e = "file_explorer"
E = "file_explorer_in_current_buffer_directory"
# 配置源码入口：:config-open 打开的是只读生成物（nix store 符号链接），
# 这里直接打开 Home Manager 读取的仓库源文件；改完仍需 home-manager switch
c = ":open ~/.config/home-manager/home/config/helix/config.toml"

[keys.normal.space.g]
# c = 原生 changed_file_picker（默认 Space g 是叶子，被本分组覆盖后需显式补回）
c = "changed_file_picker"
# 以下都是只读弹层输出（:sh 不改动缓冲区），不是交互式 Git 面板
b = ":echo %sh{git blame -L %{cursor_line},+1 -- \"%{buffer_name}\"}"
d = ":sh git diff -- \"%{buffer_name}\""
l = ":sh git log --oneline --decorate -n 20"
s = ":sh git status --short --branch"

[keys.normal.space.s]
s = "symbol_picker"
S = "workspace_symbol_picker"
g = "global_search"

[keys.normal.space.w]
"-" = "hsplit"
"|" = "vsplit"
h = "jump_view_left"
j = "jump_view_down"
k = "jump_view_up"
l = "jump_view_right"
o = "wonly"
q = "wclose"
d = "wclose"
s = "hsplit"
v = "vsplit"

[keys.normal.space.x]
x = "diagnostics_picker"
X = "workspace_diagnostics_picker"

[keys.normal.space.u]
f = ":toggle auto-format"
h = ":toggle file-picker.hidden"
i = ":toggle lsp.display-inlay-hints"
l = ":toggle line-number absolute relative"
r = ":toggle rulers [] [100]"
s = ":toggle search.smart-case"
w = ":toggle soft-wrap.enable"
W = ":toggle whitespace.render all none"
# 只重载已部署配置；改仓库源码后仍需 home-manager switch
R = ":config-reload"

[keys.normal.space.q]
q = ":qa"

[keys.insert]
# C-s 保持原生 commit_undo_checkpoint（撤销边界）；保存用 Esc 回到 Normal 后按 C-s
j = { k = "normal_mode" } # jk 大法
"C-space" = "completion"
"C-k" = "signature_help"

[keys.select]
# 工作流键与 Normal 共享；编辑键按模式区分（Select 用 extend_*，不是 move_*）
"C-s" = ":w"
"C-q" = ":q"
"C-h" = "jump_view_left"
"C-j" = "jump_view_down"
"C-k" = "jump_view_up"
"C-l" = "jump_view_right"
"H" = "goto_previous_buffer"
"L" = "goto_next_buffer"
"C-/" = "toggle_comments"
# 默认 gj/gk 在 Select 下已是 extend_line_down/up，这里只是给同一语义补别名
"A-j" = "extend_line_down"
"A-k" = "extend_line_up"
# y/p/P 不再走剪贴板专用命令，与 Normal 一致使用默认寄存器
"[" = { b = "goto_previous_buffer", d = "goto_prev_diag", g = "goto_prev_change" }
"]" = { b = "goto_next_buffer", d = "goto_next_diag", g = "goto_next_change" }
