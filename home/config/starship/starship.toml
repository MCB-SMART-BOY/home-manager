# Starship 提示符配置 — Catppuccin Mocha 主题（Garuda Mokka 移植 + 模块增强）
# ~/.config/starship.toml

# ══════════════════════════════════════════════════════════════════
# 🎨 通用设置
# ══════════════════════════════════════════════════════════════════

# 提示符结构布局（Catppuccin Mocha + Garuda 增强：sudo / git_metrics / status）
format = """
$os\
$sudo\
$username\
$hostname\
$battery\
$directory\
$git_branch\
$git_status\
$git_metrics\
$git_commit\
$rust\
$python\
$golang\
$nix_shell\
$docker_context\
$cmd_duration\
$status\
$line_break\
$character"""

# 命令超时时间 (毫秒)
command_timeout = 1000

# 仓库扫描超时 (毫秒)，避免大仓库卡顿
scan_timeout = 200

# 换行前添加空行
add_newline = true

palette = "catppuccin_mocha"

# ══════════════════════════════════════════════════════════════════
# 📍 提示符符号
# ══════════════════════════════════════════════════════════════════

[character]
success_symbol = "[❯](bold mauve)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_symbol = "[❮](bold mauve)"
vimcmd_replace_one_symbol = "[❮](bold mauve)"
vimcmd_visual_symbol = "[❮](bold yellow)"

# ══════════════════════════════════════════════════════════════════
# 🔑 Sudo 凭证状态（Garuda Mokka 借鉴）
# ══════════════════════════════════════════════════════════════════

[sudo]
disabled = false

# ══════════════════════════════════════════════════════════════════
# 💻 操作系统图标
# ══════════════════════════════════════════════════════════════════

[os]
disabled = false
style = "bold mauve"
format = "[$symbol]($style) "

[os.symbols]
Alpine = " "
Arch = " "
Debian = " "
Fedora = " "
Garuda = "󰛓 "
Gentoo = " "
Linux = " "
Macos = " "
NixOS = " "
Ubuntu = " "
Windows = "󰍲 "

# ══════════════════════════════════════════════════════════════════
# 👤 用户名与主机名
# ══════════════════════════════════════════════════════════════════

[username]
show_always = true
style_user = "bold mauve"
style_root = "bold red"
format = "[$user]($style)@"

[hostname]
ssh_only = false
style = "bold maroon"
format = "[$hostname]($style) in "

# ══════════════════════════════════════════════════════════════════
# 📁 路径显示
# ══════════════════════════════════════════════════════════════════

[directory]
style = "bold peach"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "bold red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Projects" = "󰲋 "
"~" = "󰋜 "

# ══════════════════════════════════════════════════════════════════
# 🌿 Git 状态
# ══════════════════════════════════════════════════════════════════

[git_branch]
symbol = " "
style = "bold mauve"
format = "on [$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "bold maroon"
format = '([\[$all_status$ahead_behind\]]($style) )'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "="
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_metrics]
disabled = false
added_style = "bold green"
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[git_commit]
style = "bold green"
format = '[\($hash$tag\)]($style) '
commit_hash_length = 7
tag_disabled = false
tag_symbol = " 🏷  "
only_detached = true

# ══════════════════════════════════════════════════════════════════
# 🦀 Rust 环境
# ══════════════════════════════════════════════════════════════════

[rust]
symbol = "🦀 "
style = "bold peach"
format = "via [$symbol($version )]($style)"
detect_extensions = ["rs"]
detect_files = ["Cargo.toml", "Cargo.lock"]

# ══════════════════════════════════════════════════════════════════
# 🐍 Python 环境
# ══════════════════════════════════════════════════════════════════

[python]
symbol = " "
style = "bold yellow"
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
detect_extensions = ["py"]
detect_files = ["requirements.txt", "pyproject.toml", "setup.py", "Pipfile"]

# ══════════════════════════════════════════════════════════════════
# 🐹 Go 环境
# ══════════════════════════════════════════════════════════════════

[golang]
symbol = " "
style = "bold teal"
format = "via [$symbol($version )]($style)"
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum"]

# ══════════════════════════════════════════════════════════════════
# 📦 Node.js 环境
# ══════════════════════════════════════════════════════════════════

[nodejs]
disabled = true

# ══════════════════════════════════════════════════════════════════
# ❄️ Nix Shell 环境
# ══════════════════════════════════════════════════════════════════

[nix_shell]
symbol = " "
style = "bold blue"
impure_msg = "[impure](bold red)"
pure_msg = "[pure](bold green)"
format = 'via [$symbol$state( \($name\))]($style) '

# ══════════════════════════════════════════════════════════════════
# 🐳 Docker 环境
# ══════════════════════════════════════════════════════════════════

[docker_context]
symbol = " "
style = "bold blue"
format = "via [$symbol$context]($style) "
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

# ══════════════════════════════════════════════════════════════════
# ⏱️ 命令耗时
# ══════════════════════════════════════════════════════════════════

[cmd_duration]
min_time = 2000
style = "bold flamingo"
format = "took [$duration]($style) "
show_milliseconds = true
show_notifications = true
min_time_to_notify = 30000

# ══════════════════════════════════════════════════════════════════
# ❌ 命令退出状态（Garuda Mokka 借鉴）
# ══════════════════════════════════════════════════════════════════

[status]
disabled = false
format = '[\[$symbol$common_meaning$signal_name$maybe_int\]]($style) '
map_symbol = true
pipestatus = true
symbol = "✖"
not_executable_symbol = ""
not_found_symbol = ""
sigint_symbol = "󰟾"
signal_symbol = ""

# ══════════════════════════════════════════════════════════════════
# 🔋 电池电量（Garuda Mokka 借鉴）
# ══════════════════════════════════════════════════════════════════

[battery]
disabled = false
charging_symbol = ""
discharging_symbol = ""
full_symbol = ""

[[battery.display]]
style = "bold red"
threshold = 15

[[battery.display]]
style = "bold peach"
threshold = 50

# ══════════════════════════════════════════════════════════════════
# 🎨 Catppuccin Mocha 配色（Garuda Mokka，与终端 kitty 统一）
# ══════════════════════════════════════════════════════════════════
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
