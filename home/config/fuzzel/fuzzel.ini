# Fuzzel 启动器配置
# ~/.config/fuzzel/fuzzel.ini
# DMS/Noctalia 风格主题

[main]
# 字体设置
font=Noto Sans CJK SC:size=13:weight=600
dpi-aware=auto
# 提示符
prompt="󰍉  "
icon-theme=Papirus-Dark
icons-enabled=yes
# 搜索字段匹配
fields=name,generic,comment,categories,filename,keywords
# 匹配模式（fuzzy 为常见默认）
match-mode=fuzzy
show-actions=no
# 默认终端
terminal=kitty
# 启动器所在层级（overlay 在最上层）
layer=overlay

# 尺寸与布局
lines=9
width=40
horizontal-pad=22
vertical-pad=16
inner-pad=12
line-height=30

[colors]
# 颜色格式：RRGGBBAA（Catppuccin Mocha）
background=1e1e2eee
text=cdd6f4ff
prompt=cba6f7ff
input=cdd6f4ff
match=f9e2afff
selection=45475aff
selection-text=cdd6f4ff
selection-match=cba6f7ff
border=585b70ff
[border]
width=2
radius=16

[dmenu]
mode=text
exit-immediately-if-empty=no
